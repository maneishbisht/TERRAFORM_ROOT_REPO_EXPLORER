name: Terraform Apply - Root AWS Architecture

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  terraform-apply:
    name: Apply Terraform Infrastructure
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      APPLICATION_CONFIG_REPO: ${{ secrets.REPO_EXPLORER_APPLICATION_CONFIG }}
      CONFIG_REPO_PAT: ${{ secrets.CONFIG_REPO_PAT }}

    steps:

      # ============================================================
      # 1. Checkout Terraform repository
      # ============================================================
      - name: Checkout Terraform Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Verify AWS authentication
      # ============================================================
      - name: Verify AWS Identity
        run: |
          set -e

          aws sts get-caller-identity


      # ============================================================
      # 3. Setup Terraform
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0


      # ============================================================
      # 4. Terraform Init
      # ============================================================
      - name: Terraform Init
        run: |
          set -e

          terraform init


      # ============================================================
      # 5. Terraform Validate
      # ============================================================
      - name: Terraform Validate
        run: |
          set -e

          terraform validate


      # ============================================================
      # 6. Terraform Apply
      # ============================================================
      - name: Terraform Apply
        run: |
          set -e

          terraform apply \
            -auto-approve


      # ============================================================
      # 7. Update Application Config Repository
      #
      # This step runs only after all previous steps succeed.
      #
      # It:
      #   - Retrieves dev/test/prod EKS endpoints
      #   - Retrieves dev/test VPC IDs
      #   - Clones REPO_EXPLORER_APPLICATION_CONFIG
      #   - Updates values-dev.yaml
      #   - Updates values-test.yaml
      #   - Updates values-prod.yaml
      #   - Updates aws.vpcId in dev/test values
      #   - Commits the changes
      #   - Pushes them to master
      #
      # PROD-specific commands are currently commented out.
      # They can be enabled later by removing the comments.
      # ============================================================
      - name: Update EKS Endpoints and VPC IDs in Application Config
        run: |
          set -euo pipefail

          echo "Fetching EKS cluster endpoints and VPC IDs..."

          DEV_ENDPOINT=$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "dev_cluster" \
            --query "cluster.endpoint" \
            --output text)

          TEST_ENDPOINT=$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "test_cluster" \
            --query "cluster.endpoint" \
            --output text)

          DEV_VPC_ID=$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "dev_cluster" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text)

          TEST_VPC_ID=$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "test_cluster" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text)

          # PROD CLUSTER - currently disabled
          # Uncomment the complete block below when the prod cluster is required.
          #
          # PROD_ENDPOINT=$(aws eks describe-cluster \
          #   --region "$AWS_REGION" \
          #   --name "prod_cluster" \
          #   --query "cluster.endpoint" \
          #   --output text)
          #
          # PROD_VPC_ID=$(aws eks describe-cluster \
          #   --region "$AWS_REGION" \
          #   --name "prod_cluster" \
          #   --query "cluster.resourcesVpcConfig.vpcId" \
          #   --output text)

          echo "Dev endpoint retrieved."
          echo "Test endpoint retrieved."

          echo "Dev VPC ID retrieved: $DEV_VPC_ID"
          echo "Test VPC ID retrieved: $TEST_VPC_ID"

          # PROD CLUSTER - currently disabled
          # Uncomment when PROD_ENDPOINT and PROD_VPC_ID above are enabled.
          #
          # echo "Prod endpoint retrieved."
          # echo "Prod VPC ID retrieved: $PROD_VPC_ID"


          # --------------------------------------------------------
          # Clean possible accidental CR/LF characters from secrets
          # --------------------------------------------------------
          APPLICATION_CONFIG_REPO_CLEAN=$(printf '%s' "$APPLICATION_CONFIG_REPO" | tr -d '\r\n')
          CONFIG_REPO_PAT_CLEAN=$(printf '%s' "$CONFIG_REPO_PAT" | tr -d '\r\n')

          APPLICATION_CONFIG_REPO_CLEAN=$(printf '%s' "$APPLICATION_CONFIG_REPO_CLEAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CONFIG_REPO_PAT_CLEAN=$(printf '%s' "$CONFIG_REPO_PAT_CLEAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')


          # --------------------------------------------------------
          # Create temporary Git authentication helper
          #
          # The PAT is never placed directly into the repository URL.
          # --------------------------------------------------------
          ASKPASS_SCRIPT=$(mktemp)

          trap 'rm -f "$ASKPASS_SCRIPT"' EXIT

          cat > "$ASKPASS_SCRIPT" <<'EOF'
          #!/bin/sh

          case "$1" in
            *Username*)
              printf '%s\n' "x-access-token"
              ;;
            *Password*)
              printf '%s\n' "$CONFIG_REPO_PAT_CLEAN"
              ;;
          esac
          EOF

          chmod 700 "$ASKPASS_SCRIPT"

          export GIT_ASKPASS="$ASKPASS_SCRIPT"
          export GIT_TERMINAL_PROMPT=0
          export CONFIG_REPO_PAT_CLEAN


          # --------------------------------------------------------
          # Clone application configuration repository
          # --------------------------------------------------------
          rm -rf application-config

          echo "Cloning application configuration repository..."

          git clone \
            --branch master \
            "$APPLICATION_CONFIG_REPO_CLEAN" \
            application-config

          cd application-config


          # --------------------------------------------------------
          # Configure Git identity
          # --------------------------------------------------------
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          # --------------------------------------------------------
          # Update endpoint and VPC ID values
          # --------------------------------------------------------
          python3 - "$DEV_ENDPOINT" "$TEST_ENDPOINT" "$DEV_VPC_ID" "$TEST_VPC_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          endpoint_values = {
              "values-dev.yaml": {
                  "endpoint": sys.argv[1],
                  "vpcId": sys.argv[3],
              },
              "values-test.yaml": {
                  "endpoint": sys.argv[2],
                  "vpcId": sys.argv[4],
              },

              # PROD CLUSTER - currently disabled
              # Uncomment this block when PROD_ENDPOINT and PROD_VPC_ID
              # are enabled above.
              #
              # "values-prod.yaml": {
              #     "endpoint": sys.argv[5],
              #     "vpcId": sys.argv[6],
              # },
          }

          for filename, values in endpoint_values.items():
              path = Path(filename)

              if not path.exists():
                  raise FileNotFoundError(
                      f"Required file not found: {filename}"
                  )

              content = path.read_text()

              # ----------------------------------------------------
              # Update endpoint
              #
              # Match an indented endpoint field such as:
              #
              #   endpoint: "REPLACE_WITH_DEV_EKS_ENDPOINT"
              #
              # Preserve the existing indentation.
              # ----------------------------------------------------
              endpoint_pattern = r'^([ \t]*)endpoint:\s*.*$'

              def replace_endpoint(match):
                  indentation = match.group(1)
                  return f'{indentation}endpoint: "{values["endpoint"]}"'

              updated, endpoint_count = re.subn(
                  endpoint_pattern,
                  replace_endpoint,
                  content,
                  count=1,
                  flags=re.MULTILINE
              )

              if endpoint_count != 1:
                  raise RuntimeError(
                      f"Could not find exactly one endpoint field in {filename}"
                  )


              # ----------------------------------------------------
              # Update aws.vpcId
              #
              # Expected structure:
              #
              # aws:
              #   region: ap-south-1
              #   vpcId: "..."
              #
              # The script only modifies vpcId inside the aws block.
              # ----------------------------------------------------
              lines = updated.splitlines(keepends=True)

              aws_index = None
              aws_indent = None

              for i, line in enumerate(lines):
                  match = re.match(r'^([ \t]*)aws:\s*(?:#.*)?$', line.rstrip('\r\n'))

                  if match:
                      aws_index = i
                      aws_indent = len(match.group(1).expandtabs(2))
                      break

              if aws_index is None:
                  raise RuntimeError(
                      f"Could not find aws: section in {filename}"
                  )


              vpc_id_count = 0
              vpc_updated = False

              for i in range(aws_index + 1, len(lines)):
                  line = lines[i]

                  # Stop when another top-level section begins.
                  if line.strip() and not line[0].isspace():
                      break

                  vpc_match = re.match(
                      r'^([ \t]*)vpcId:\s*.*$',
                      line.rstrip('\r\n')
                  )

                  if vpc_match:
                      indentation = vpc_match.group(1)

                      lines[i] = (
                          f'{indentation}vpcId: "{values["vpcId"]}"'
                          + ('\n' if line.endswith('\n') else '')
                      )

                      vpc_id_count += 1
                      vpc_updated = True
                      break


              if not vpc_updated:
                  raise RuntimeError(
                      f"Could not find aws.vpcId field in {filename}"
                  )

              if vpc_id_count != 1:
                  raise RuntimeError(
                      f"Expected exactly one aws.vpcId field in {filename}, "
                      f"found {vpc_id_count}"
                  )


              # ----------------------------------------------------
              # Write updated file
              # ----------------------------------------------------
              path.write_text(''.join(lines))

              print(
                  f"Updated endpoint and aws.vpcId in {filename}"
              )

          PY


          # --------------------------------------------------------
          # Display changes
          # --------------------------------------------------------
          echo ""
          echo "Git diff:"

          git diff -- \
            values-dev.yaml \
            values-test.yaml

          # PROD CLUSTER - currently disabled
          # Do NOT place this comment after a line ending in "\"
          # Uncomment the following line when PROD is required.
          #
          # git diff -- \
          #   values-dev.yaml \
          #   values-test.yaml \
          #   values-prod.yaml


          # --------------------------------------------------------
          # Commit only when something actually changed
          # --------------------------------------------------------
          if git diff --quiet -- \
            values-dev.yaml \
            values-test.yaml
          then

            echo "No endpoint or VPC ID changes detected."

          else

            git add \
              values-dev.yaml \
              values-test.yaml

            # PROD CLUSTER - currently disabled
            # Uncomment the following line when PROD is required.
            #
            # git add values-prod.yaml

            git commit \
              -m "Update EKS cluster endpoints and VPC IDs"

            echo "Pushing endpoint and VPC ID updates to master..."

            git push origin HEAD:master

            echo "Application configuration repository updated successfully."

          fi